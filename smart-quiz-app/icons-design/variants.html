<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #eef1f6; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .grid { display: grid; grid-template-columns: 240px 240px; gap: 28px; padding: 30px; }
  .cell { text-align: center; }
  .cell .name { font-size: 15px; font-weight: 700; color: #1c2333; margin-top: 10px; }
  .cell .desc { font-size: 12px; color: #5b6478; margin-top: 3px; }
  .frame { width: 220px; height: 220px; }
</style>
</head>
<body>
<div class="grid">

  <!-- A: S7 徽章 + 梯形图触点 -->
  <div class="cell">
    <svg class="frame" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2456d6"/><stop offset="1" stop-color="#7a3df0"/>
        </linearGradient>
      </defs>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#gA)"/>
      <text x="256" y="268" font-family="Segoe UI, Arial" font-size="220" font-weight="800"
            font-style="italic" fill="#ffffff" text-anchor="middle">S7</text>
      <!-- 梯形图：母线+触点+线圈 -->
      <g stroke="#ffffff" stroke-width="17" stroke-linecap="round" fill="none" opacity="0.95">
        <path d="M130 330 H 210"/><path d="M302 330 H 382"/>
        <path d="M210 306 v48"/><path d="M252 306 v48"/>
        <path d="M252 330 H 302"/>
        <circle cx="352" cy="330" r="30"/>
      </g>
    </svg>
    <div class="name">A · S7 徽章</div>
    <div class="desc">斜体 S7 + 梯形图触点/线圈符号（PLC 程序员的身份标识）</div>
  </div>

  <!-- B: 触点 + 对勾 -->
  <div class="cell">
    <svg class="frame" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0e9f6e"/><stop offset="1" stop-color="#2456d6"/>
        </linearGradient>
      </defs>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#gB)"/>
      <g stroke="#ffffff" stroke-width="30" stroke-linecap="round" fill="none">
        <path d="M110 256 H 180"/>
        <path d="M180 208 v96"/><path d="M240 208 v96"/>
        <path d="M240 256 H 300"/>
        <!-- 对勾 -->
        <path d="M310 258 L 352 306 L 428 190" stroke="#7CFCB0" stroke-width="42"/>
      </g>
    </svg>
    <div class="name">B · 触点与对勾</div>
    <div class="desc">常开触点符号 + 绿色对勾（刷题通过），绿蓝渐变</div>
  </div>

  <!-- C: PLC 模块 -->
  <div class="cell">
    <svg class="frame" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2456d6"/><stop offset="1" stop-color="#7a3df0"/>
        </linearGradient>
      </defs>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#gC)"/>
      <!-- CPU 模块本体 -->
      <rect x="120" y="130" width="272" height="252" rx="26" fill="#ffffff"/>
      <rect x="150" y="162" width="212" height="86" rx="14" fill="#1c2e5e"/>
      <text x="256" y="222" font-family="Segoe UI, Arial" font-size="58" font-weight="800" fill="#ffffff" text-anchor="middle">S7</text>
      <!-- 端子排 -->
      <g fill="#1c2e5e">
        <circle cx="163" cy="300" r="13"/><circle cx="216" cy="300" r="13"/>
        <circle cx="269" cy="300" r="13"/><circle cx="322" cy="300" r="13"/>
        <circle cx="163" cy="348" r="13"/><circle cx="216" cy="348" r="13"/>
        <circle cx="269" cy="348" r="13"/><circle cx="322" cy="348" r="13"/>
      </g>
      <!-- 状态 LED -->
      <circle cx="352" cy="106" r="17" fill="#7CFCB0"/>
      <rect x="104" y="392" width="304" height="20" rx="10" fill="#ffffff" opacity="0.55"/>
    </svg>
    <div class="name">C · PLC 模块</div>
    <div class="desc">CPU 模块造型（显示屏+端子+运行 LED），最"硬件"</div>
  </div>

  <!-- D: 书 + 电路 -->
  <div class="cell">
    <svg class="frame" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gD" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7a3df0"/><stop offset="1" stop-color="#2456d6"/>
        </linearGradient>
      </defs>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#gD)"/>
      <!-- 翻开的书 -->
      <path d="M256 160 C 216 128 156 122 116 132 V 356 C 156 346 216 352 256 384
               C 296 352 356 346 396 356 V 132 C 356 122 296 128 256 160 Z"
            fill="#ffffff"/>
      <path d="M256 160 V 384" stroke="#d6def5" stroke-width="10"/>
      <!-- 电路走线 -->
      <g stroke="#2456d6" stroke-width="16" stroke-linecap="round" fill="none">
        <path d="M150 210 H 210"/>
        <circle cx="150" cy="210" r="8" fill="#2456d6" stroke="none"/>
        <path d="M290 210 H 350"/><circle cx="290" cy="210" r="8" fill="#2456d6" stroke="none"/>
        <path d="M150 280 H 190 L 214 304"/>
        <path d="M290 280 H 330"/>
        <!-- 触点 -->
        <path d="M210 190 v40" stroke="#2456d6" stroke-width="13"/>
      </g>
      <path d="M322 286 L 344 312 L 386 252" stroke="#0e9f6e" stroke-width="22" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="name">D · 图纸与对勾</div>
    <div class="desc">翻开的手册/图纸 + 电路走线 + 对勾（学习属性最强）</div>
  </div>

</div>
</body>
</html>
